name: Atualizar filmes1 Movies Deluxe

on:
  push:
    branches: [main]
    paths:
      - "scripts/gerar_filmes1_movies_deluxe.py"
      - ".github/workflows/atualizar-filmes1.yml"
      - "tests/test_gerar_filmes1_movies_deluxe.py"
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: filmes1-builder
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout playlist
        uses: actions/checkout@v4

      - name: Baixar base Movies Deluxe
        shell: bash
        run: |
          mkdir -p vendor
          curl -L --fail --retry 4 --retry-delay 5 --connect-timeout 20 --max-time 180 \
            https://raw.githubusercontent.com/select/movies-deluxe/main/data/movies.json \
            -o vendor/movies.json

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar gerador
        run: python -m unittest discover -s tests -v

      - name: Gerar filmes1.m3u
        env:
          MAX_WORKERS: "12"
          HTTP_TIMEOUT: "15"
          BATCH_SIZE: "750"
        run: python -u scripts/gerar_filmes1_movies_deluxe.py

      - name: Commit
        shell: bash
        run: |
          git add filmes1.m3u data/archive_direct_cache.json
          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza filmes1 com Movies Deluxe"
          git pull --rebase origin main
          git push

      - name: Guardar resultado para diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: filmes1-diagnostico
          path: |
            filmes1.m3u
            data/archive_direct_cache.json
